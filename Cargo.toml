[package]
name = "aerogl"
version = "0.4.0"
edition = "2024"
description = "A small software 3D rasterizer with an embeddable API. No GPU required."
license = "Apache-2.0"
keywords = ["graphics", "software-renderer", "rasterizer", "3d", "gamedev"]
categories = ["graphics", "rendering", "game-development"]

[lib]
name = "aerogl"
path = "src/lib.rs"

[[bin]]
name = "aerogl-demo"
path = "src/main.rs"
required-features = ["window"]

[features]
default = ["window"]
# The minifb window backend. Disable this to use AeroGL purely headless (e.g.
# on a server, in tests, in Wasm, or with your own windowing library).
window = ["dep:minifb"]

[dependencies]
minifb = { version = "0.29.0", optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
